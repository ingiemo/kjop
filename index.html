<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6eee4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1411" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kjøp eller dropp">
  <meta name="description" content="Regn ut kostnad per bruk før du kjøper.">
  <title>Kjøp eller dropp</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="views">
    <section class="view" id="view-kalkulator" hidden></section>
    <section class="view" id="view-sammenlign" hidden></section>
    <section class="view" id="view-lagret" hidden></section>
    <section class="view" id="view-spart" hidden></section>
    <section class="view" id="view-innstillinger" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Hovedmeny">
    <a href="#kalkulator" data-tab="kalkulator">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M8.5 6.5h7"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 18.5h.01M12 18.5h.01M15.5 18.5h.01"/></svg>
      <span>Kalkulator</span>
    </a>
    <a href="#sammenlign" data-tab="sammenlign">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v17M7.5 20.5h9M5 6.5h14"/><path d="M5 6.5 2.5 13a2.5 2.5 0 0 0 5 0z"/><path d="M19 6.5 16.5 13a2.5 2.5 0 0 0 5 0z"/></svg>
      <span>Sammenlign</span>
    </a>
    <a href="#lagret" data-tab="lagret">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
      <span>Lagret</span>
    </a>
    <a href="#spart" data-tab="spart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.5 9 11.5l4 4 8-8"/><path d="M15 7.5h6v6"/></svg>
      <span>Spart</span>
    </a>
    <a href="#innstillinger" data-tab="innstillinger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span>Innstillinger</span>
    </a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="update" class="update" role="status" hidden>
    <span>Ny versjon er klar</span>
    <button type="button" id="update-btn">Oppdater</button>
  </div>
</body>
</html>
